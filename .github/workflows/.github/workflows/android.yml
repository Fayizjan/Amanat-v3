name: Build Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android Project & Build APK
        run: |
          mkdir -p output/app/src/main/assets output/app/src/main/java/com/example/app output/app/src/main/res/values
          
          if [ -f "index.html" ]; then
            cp index.html output/app/src/main/assets/index.html
          else
            echo "<html><body><h1>App Loaded</h1></body></html>" > output/app/src/main/assets/index.html
          fi

          cat << 'EOF' > output/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.example.app">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:label="My App" android:allowBackup="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > output/app/src/main/java/com/example/app/MainActivity.java
          package com.example.app;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebSettings;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView webView = new WebView(this);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setDomStorageEnabled(true);
                  webView.loadUrl("file:///android_asset/index.html");
                  setContentView(webView);
              }
          }
          EOF

          cat << 'EOF' > output/build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.1.0' }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF

          cat << 'EOF' > output/app/build.gradle
          apply plugin: 'com.android.application'

          android {
              namespace 'com.example.app'
              compileSdk 33
              defaultConfig {
                  applicationId 'com.example.app'
                  minSdk 21
                  targetSdk 33
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat << 'EOF' > output/settings.gradle
          rootProject.name = "MyApp"
          include ':app'
          EOF

          cd output
          gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: app-debug
          path: output/app/build/outputs/apk/debug/app-debug.apk
          
